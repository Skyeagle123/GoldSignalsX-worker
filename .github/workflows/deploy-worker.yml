name: Deploy GoldSignalsX Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_BASE_URL: ${{ vars.GSX_WORKER_URL || 'https://goldsignalsx-worker.samer-mourtada.workers.dev' }}
      PWA_URL: ${{ vars.GSX_PWA_URL || 'https://skyeagle123.github.io/GoldSignalsX-Ultimate/' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Post-deploy smoke test
        timeout-minutes: 5
        run: node .github/scripts/post-deploy-smoke.mjs

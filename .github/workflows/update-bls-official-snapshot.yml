name: Update official BLS snapshot

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-bls-official-snapshot.mjs
      - name: Commit verified official-source changes
        run: |
          if git diff --quiet -- bls-official-snapshot.js; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bls-official-snapshot.js
          git commit -m "Refresh official BLS snapshot"
          git push

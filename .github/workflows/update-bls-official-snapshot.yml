name: Update official BLS snapshot
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: goldsignalsx-bls-snapshot
  cancel-in-progress: false
jobs:
  generate:
    if: github.repository == 'Skyeagle123/GoldSignalsX-worker' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Generate official snapshot; restrict change scope
        id: generate
        run: |
          node scripts/update-bls-official-snapshot.mjs
          python3 -I ops/production/bls-generate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        if: steps.generate.outputs.changed == 'true'
        with:
          name: bls-snapshot-${{ github.run_id }}-1
          path: .bls-artifact/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
  pull-request:
    needs: generate
    if: needs.generate.outputs.changed == 'true' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.generate.outputs.artifact_id }}
          merge-multiple: true
          path: .bls-artifact
      - name: Write snapshot-only PR
        env:
          GH_WRITE_TOKEN: ${{ github.token }}
        run: python3 -I ops/production/bls-pr.py
